# ClaireChan settings, applied as soon as you save this file.
# agent_model and the prompt restart the hidden Claude Code session on the same conversation, once she has nothing running.

# Language of the speech recognition: "en", "fr", or "auto" to detect it on each sentence.
# Her own lines follow what you speak: French to French, English to any other language. Claude answers in your language anyway.
language = "auto"

# Wake phrase, matched ignoring case at the start of each sentence as Whisper spells it ("Hé Claire" can come out as "Et clair").
# Its first group is the command said in the same breath.
# Without an NVIDIA GPU, a small model listens for "Hey Claire" before Whisper hears anything, so changing this key does not change what wakes her.
wake = '^\W*(?:hey|hé|he|eh|et|dis|ok|okay)\W+(?:claire|clair|clare|clerc|clère|clear)\b[\s,.!?]*(.*)'

# You may pause while you speak: she sends your request after this many seconds of silence,
# or as soon as you say a `done` phrase, and drops it when you say a `cancel` phrase.
# All are regexes matched ignoring case. Short words such as "fin" end up inside real requests ("jusqu'à la fin"),
# so those in `done_alone` and `cancel_alone` only count when you say them as a sentence of their own, after a pause.
# The others count at the end of the request. She reminds you of the first of `done_alone` in English, of its last in French.
pause_s = 15.0
done = "over|c'est tout|envoie"
done_alone = "done|fin|terminé"
cancel = "cancel prompt|laisse tomber"
cancel_alone = "cancel|annule"

# When she asks your permission, say one of these words, as a sentence of its own, to answer her.
# Regexes matched ignoring case. Clicking on her and answering in Claude Code works as well.
allow = "yes|ok|go|oui|vas-y|d'accord|はい"
deny = "no|non|refuse|pas question|いいえ"

# Model of the hidden Claude session, which answers quick requests: "sonnet", "opus", "haiku", or a full model name
model = "sonnet"

# Model of the agent the session hands complicated requests to, such as code, research or several steps, in the background
agent_model = "opus"

# When you ask her to change her own code: false leaves her changes for you to review and commit, true has her commit them herself.
# She applies them once she has nothing running, reloading what changed or restarting on the same conversation.
# A change that stops her from loading or starting is put aside in git (stashed, or her commits reverted), and she tells you.
commit_changes = false

# Size of Claire on screen: 1 for the default size, 0.75 for a quarter smaller, 1.5 for half as big again
avatar_zoom = 1.0

# Size of her speech bubble and its text, on the same scale
text_zoom = 1.0

# Letters per second her bubble types at. A long text types faster, to show in full within a second.
typing_speed = 80.0

# She says her replies and her permission requests aloud in Japanese, whatever language you speak, the bubble being their subtitles.
# Claude Haiku translates each line, which takes a little of your plan's usage, and AivisSpeech says it on the CPU (0.5 GB, downloaded by the setup).
# false keeps her silent.
voice = true

# Her AivisSpeech voice, by its style id. 1431611904 is Mai (MAHOPROGRAM, ACML 1.0, https://hub.aivis-project.com/aivm-models/e9339137-2ae3-4d41-9394-fb757a7e61e6).
# Another voice of AivisHub goes into %APPDATA%\AivisSpeech-Engine\Models, and http://127.0.0.1:10101/speakers lists the style ids while she speaks.
voice_style = 1431611904

# How loud her voice is, from 0.0 (silent) to 1.0. The slider of her tray menu sets it.
volume = 1.0

# The city she gives the weather of when you do not name one
city = ""

# Applications whose windows she may use, by the file name of their program: "read" to read them, "act" to also press buttons and fill fields.
# She asks you the first time she acts in one since the app started. Terminals stay closed to her, whatever this says.
# She never presses a key nor moves the mouse. In VS Code, Discord, Edge, or a field of Firefox, an action brings the window to the front,
# so she waits until you leave keyboard and mouse alone for 3 s in one of these applications, never a game, with nothing full screen,
# then gives you your window back.
apps = { "firefox.exe" = "act", "Code.exe" = "act", "Discord.exe" = "read" }

# Your additions to the system prompt of the hidden Claude session, after what the app writes there itself:
# where ClaireChan is installed and how it started the session. Write them between the two ''' lines, for example:
# "My projects are located in D:\advanced_desktop, my screenshots in D:\Captures."
prompt = '''
'''

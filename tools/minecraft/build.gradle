plugins {
	id 'net.fabricmc.fabric-loom' version '1.15.+'
}

version = '0.1.0'
group = 'dev.stoupy'
base {
	archivesName = 'clairechan-bridge'
}

loom {
	runs {
		client {
			runDir 'run'
			programArgs '--username', 'ClaireChan'
		}
		// A second player for tests that need two, such as two game modes at once.
		client2 {
			inherit client
			configName = 'Minecraft Client 2'
			runDir 'run2'
			programArgs '--username', 'ClaireChan2'
			vmArg '-Dclairechan.bridge.port=47622'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

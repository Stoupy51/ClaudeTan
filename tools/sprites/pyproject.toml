[project]
name = "claudechan-sprites"
version = "0.0.0"
description = "Builds the Claire sprites from the source video and image edits"
requires-python = "==3.13.*"
dependencies = [
	"accelerate>=1.15.0",
	"bitsandbytes>=0.50.2",
	"diffusers==0.41.*",
	"einops",
	"huggingface-hub",
	"kornia",
	"numpy",
	"nunchaku",
	"opencv-python<5",
	"resvg-py>=0.5",
	"spandrel",
	"timm",
	"torch==2.11.*",
	"torchvision",
	"transformers",
	"yt-dlp",
]

[tool.uv]
package = false

[tool.uv.sources]
nunchaku = { url = "https://github.com/nunchaku-ai/nunchaku/releases/download/v1.3.0dev20260213/nunchaku-1.3.0.dev20260213+cu12.8torch2.11-cp313-cp313-win_amd64.whl" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pyright]
typeCheckingMode = "strict"

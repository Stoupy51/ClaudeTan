# ClaudeTan settings. Quit the app from its tray icon and start it again to apply a change.

# Language of the speech recognition: "fr", "en", or "auto" to detect it on each sentence
language = "auto"

# Wake phrase, matched ignoring case at the start of each sentence as Whisper spells it ("Hé Claude" often comes out as "Et Claude").
# Its first group is the command said in the same breath.
wake = '^\W*(?:hey|hé|he|eh|et|dis|ok|okay)\W+(?:claude|clode|clod|clodo|clown)\b[\s,.!?]*(.*)'

# Your additions to the system prompt of the hidden Claude session, after what the app writes there itself:
# where ClaudeTan is installed and how it started the session. Write them between the two ''' lines, for example:
# Mes projets sont dans D:\advanced_desktop, mes captures d'écran dans D:\Captures.
prompt = '''
'''

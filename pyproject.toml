[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "claudetan"
version = "1.0.0"
description = "Voice-driven Claude Code assistant with an anime avatar overlay"
keywords = ["claude", "claude-code", "voice-assistant", "avatar", "overlay", "whisper", "pyside6"]
requires-python = ">=3.14"
classifiers = [
	"Development Status :: 2 - Pre-Alpha",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.14",
	"Operating System :: Microsoft :: Windows",
	"Typing :: Typed",
]
dependencies = [
	"faster-whisper>=1.2",
	"numpy",
	"pyside6>=6.9",
	"pyte>=0.8.2",
	"pywinpty>=2.0",
	"sherpa-onnx>=1.13",
	"soundcard>=0.4.6",
	"sounddevice",
	"soundfile",
	"stouputils>=26.10.1",
	"uiautomation>=2.0.29",
]
authors = [
	{ name = "Stoupy51", email = "stoupy51@gmail.com" },
]

[project.scripts]
claudetan = "claudetan.app:main"
claudetan-setup = "claudetan.setup:main"

[project.urls]
Issues = "https://github.com/Stoupy51/ClaudeTan/issues"
Repository = "https://github.com/Stoupy51/ClaudeTan"

[dependency-groups]
dev = [
	"pyright",
	"pytest",
	"ruff",
]

[tool.pyright]
typeCheckingMode = "strict"
# The sprite pipeline is its own uv project, checked with its own environment
exclude = ["tools/sprites"]

[tool.complexipy]
paths = ["."]
max-complexity-allowed = 15
sort = "desc"

[tool.ruff]
exclude = [
	".git",
	".ruff_cache",
	".venv",
	".vscode",
	"build",
	"dist",
	"*.pyi",
]
line-length = 135
# The sprite modules import each other by plain name, as scripts run from their folder
src = ["src", "tools/sprites"]

[tool.ruff.lint.isort]
# Keeps the "name as name" re-exports of a package grouped in a single statement
combine-as-imports = true

[tool.ruff.lint]
select = [
	"E",
	"W",
	"F",
	"I",
	"N",
	"UP",
	"B",
	"C4",
	"T20",
	"RUF",
	"RET",
	"SIM",
	"PIE",
	"PERF401",
	"PGH003",
	"FBT003",
	"TRY203",
	"S110",
	"PLR5501",
]
ignore = [
	"T201",
	"W191",
	"N803",
	"N806",
]


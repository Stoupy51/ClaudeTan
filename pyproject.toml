[project]
name = "claude-assist"
version = "0.0.0"
description = "Voice-driven Claude Code assistant with an anime avatar overlay"
requires-python = ">=3.14"
dependencies = [
	"faster-whisper>=1.2",
	"numpy",
	"pyside6>=6.9",
	"pywinpty>=2.0",
	"sounddevice",
	"soundfile",
]

[tool.uv]
package = false

[tool.pyright]
typeCheckingMode = "strict"

[project]
name = "claudetan"
version = "0.0.0"
description = "Voice-driven Claude Code assistant with an anime avatar overlay"
keywords = ["claude", "claude-code", "voice-assistant", "avatar", "overlay", "whisper", "pyside6"]
requires-python = ">=3.14"
classifiers = [
	"Development Status :: 2 - Pre-Alpha",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.14",
	"Operating System :: Microsoft :: Windows",
	"Typing :: Typed",
]
dependencies = [
	"faster-whisper>=1.2",
	"numpy",
	"pyside6>=6.9",
	"pywinpty>=2.0",
	"sounddevice",
	"soundfile",
]
authors = [
	{ name = "Stoupy51", email = "stoupy51@gmail.com" },
]

[project.urls]
Issues = "https://github.com/Stoupy51/ClaudeTan/issues"
Repository = "https://github.com/Stoupy51/ClaudeTan"

[dependency-groups]
dev = [
	"pyright",
	"ruff",
]

[tool.uv]
package = false

[tool.pyright]
typeCheckingMode = "strict"
# The sprite pipeline is its own uv project, checked with its own environment
exclude = ["tools/sprites"]

[tool.complexipy]
paths = ["."]
max-complexity-allowed = 15
sort = "desc"

[tool.ruff]
exclude = [
	".git",
	".ruff_cache",
	".venv",
	".vscode",
	"build",
	"dist",
	"*.pyi",
]
line-length = 135
# The sprite modules import each other by plain name, as scripts run from their folder
src = [".", "tools/sprites"]

[tool.ruff.lint.isort]
# Keeps the "name as name" re-exports of a package grouped in a single statement
combine-as-imports = true

[tool.ruff.lint]
select = [
	"E",
	"W",
	"F",
	"I",
	"N",
	"UP",
	"B",
	"C4",
	"T20",
	"RUF",
	"RET",
	"SIM",
	"PIE",
	"PERF401",
	"PGH003",
	"FBT003",
	"TRY203",
	"S110",
	"PLR5501",
]
ignore = [
	"T201",
	"W191",
	"N803",
	"N806",
]

